# Local development stack. Usage: cp .env.example .env && docker compose up --build
name: watchdog

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # localhost only, for local tools (psql, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The backend waits for it to succeed.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-watchdog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchdog}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-ollama:qwen2.5:7b}
      LLM_MODELS: ${LLM_MODELS:-{}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      # Resolved from /app as ../domain_packs, ../datasets/generated, ../.cache/models.
      - ./domain_packs:/domain_packs:ro
      - ./datasets:/datasets
      - ./.cache:/.cache   # embedding/reranker model files, shared with local runs
    extra_hosts:
      - "host.docker.internal:${DOCKER_BRIDGE_IP:-172.17.0.1}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Lets containers reach Ollama on the host WITHOUT exposing Ollama to the network:
  # listens only on the Docker bridge address and forwards to Ollama on localhost.
  ollama-relay:
    image: alpine/socat:1.8.0.3
    network_mode: host
    command: ["TCP-LISTEN:11434,bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr", "TCP:127.0.0.1:11434"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
