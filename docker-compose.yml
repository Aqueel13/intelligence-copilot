# Local development stack. Usage: cp .env.example .env && docker compose up --build
name: watchdog

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # localhost only, for local tools (psql, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The backend waits for it to succeed.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-watchdog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchdog}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-ollama:qwen2.5:7b}
      LLM_MODELS: ${LLM_MODELS:-{}}
      LLM_LIGHT_MODEL: ${LLM_LIGHT_MODEL:-}
      RATE_LIMIT_INVESTIGATIONS_PER_USER_HOUR: ${RATE_LIMIT_INVESTIGATIONS_PER_USER_HOUR:-4}
      RATE_LIMIT_INVESTIGATIONS_PER_DAY: ${RATE_LIMIT_INVESTIGATIONS_PER_DAY:-12}
      RATE_LIMIT_QUESTIONS_PER_USER_HOUR: ${RATE_LIMIT_QUESTIONS_PER_USER_HOUR:-20}
      RATE_LIMIT_QUESTIONS_PER_DAY: ${RATE_LIMIT_QUESTIONS_PER_DAY:-80}
      WATCH_AUTO_INVESTIGATE: ${WATCH_AUTO_INVESTIGATE:-critical}
      ANONYMOUS_VISITORS: ${ANONYMOUS_VISITORS:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPERATIONS_MCP_URL: http://operations-mcp:8103/mcp
      OPERATIONS_MCP_BACKEND_TOKEN: ${OPERATIONS_MCP_BACKEND_TOKEN:?run make secrets}
      OPERATIONS_MCP_TOKENS: '{"${OPERATIONS_MCP_BACKEND_TOKEN}": "watchdog-backend", "${OPERATIONS_MCP_EXTERNAL_TOKEN:?run make secrets}": "external-agent"}'
      ANALYTICS_MCP_TOKENS: '{"${ANALYTICS_MCP_EXTERNAL_TOKEN:?run make secrets}": "external-agent"}'
      KNOWLEDGE_MCP_TOKENS: '{"${KNOWLEDGE_MCP_EXTERNAL_TOKEN:?run make secrets}": "external-agent"}'
      ENTERPRISE_API_URL: http://enterprise-mock:8201
      ENTERPRISE_API_KEY: ${ENTERPRISE_API_KEY:?run make secrets}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      # Resolved from /app as ../domain_packs, ../datasets/generated, ../.cache/models.
      - ./domain_packs:/domain_packs:ro
      - ./datasets:/datasets
      - ./.cache:/.cache   # embedding/reranker model files, shared with local runs
      - ./evaluation:/evaluation:ro   # saved evaluation runs (model comparison page)
    extra_hosts:
      - "host.docker.internal:${DOCKER_BRIDGE_IP:-172.17.0.1}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Operations MCP server: governed actions for the backend AND external MCP clients.
  # Published on localhost only, so MCP clients on this machine (e.g. Claude) can connect.
  operations-mcp:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.mcp_servers.operations:app", "--host", "0.0.0.0", "--port", "8103"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./domain_packs:/domain_packs:ro
    ports:
      - "127.0.0.1:8103:8103"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Read-only Analytics and Knowledge MCP servers for external clients (localhost only).
  analytics-mcp:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.mcp_servers.analytics:app", "--host", "0.0.0.0", "--port", "8101"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./domain_packs:/domain_packs:ro
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  knowledge-mcp:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.mcp_servers.knowledge:app", "--host", "0.0.0.0", "--port", "8102"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./domain_packs:/domain_packs:ro
      - ./.cache:/.cache   # embedding model files
    ports:
      - "127.0.0.1:8102:8102"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Watch layer: evaluates the domain pack's KPI monitors on a schedule and maintains alerts.
  watcher:
    build: ./backend
    command: ["python", "-m", "watchdog_backend.watch", "--every", "${WATCH_INTERVAL_SECONDS:-3600}"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./domain_packs:/domain_packs:ro
      - ./.cache:/.cache   # embedding model files (automatic triage runs investigations)
    extra_hosts:
      - "host.docker.internal:${DOCKER_BRIDGE_IP:-172.17.0.1}"   # Ollama, via the relay
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Stand-in for the client's claims administration system (internal only).
  enterprise-mock:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.enterprise_mock.app:app", "--host", "0.0.0.0", "--port", "8201"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Lets containers reach Ollama on the host WITHOUT exposing Ollama to the network:
  # listens only on the Docker bridge address and forwards to Ollama on localhost.
  ollama-relay:
    image: alpine/socat:1.8.0.3
    network_mode: host
    command: ["TCP-LISTEN:11434,bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr", "TCP:127.0.0.1:11434"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
