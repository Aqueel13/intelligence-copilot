# Local development stack. Usage: cp .env.example .env && docker compose up --build
name: watchdog

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # localhost only, for local tools (psql, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The backend waits for it to succeed.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-watchdog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchdog}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    command: ["uvicorn", "watchdog_backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    environment: *backend-env
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      # Resolved from /app as ../domain_packs and ../datasets/generated (the app defaults).
      - ./domain_packs:/domain_packs:ro
      - ./datasets:/datasets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
