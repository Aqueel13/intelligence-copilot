[project]
name = "watchdog-backend"
version = "0.1.0"
description = "Intelligence WatchDog backend: API, orchestration, analytics and governance"
authors = [
    { name = "Aqueel" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# User-facing text intentionally uses the en dash and multiplication sign (e.g. "₹2L–₹5L", "2×").
allowed-confusables = ["–", "×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
