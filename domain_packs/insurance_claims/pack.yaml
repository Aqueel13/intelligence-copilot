# Insurance Claims domain pack.
# Everything specific to insurance lives here; the engine (tables, metrics, agents) is generic.

domain: insurance_claims
display_name: Insurance Claims (Motor & Health, reimbursement)
subject: an Indian general insurer's motor and health claims
version: 1

case:
  label: claim                # what one "case" is called in this domain
  plural: claims
  id_prefix: CLM
  currency: INR
  timezone: Asia/Kolkata

sla:
  name: Claim turnaround
  target_hours: 120           # 5 calendar days, FNOL → Closed
  start_activity: FNOL
  end_activity: Closed

calendar:
  workdays: [mon, tue, wed, thu, fri]
  start: "09:00"
  end: "18:00"

# Case attributes the analysis can filter and group by.
# `source: attribute` = stored in the case's JSONB attributes.
dimensions:
  - name: line_of_business
    label: Line of business
    source: attribute
    values: [motor, health]
  - name: channel
    label: Channel
    source: attribute
    values: [direct, broker, agent]
  - name: region
    label: Region
    source: attribute
    values: [Mumbai, Delhi NCR, Bengaluru, Chennai, Hyderabad, Kolkata, Pune]
  - name: team
    label: Verification team
    source: attribute
    values: [Team A, Team B, Team C]
  - name: amount_band
    label: Claim amount band
    source: amount_band
    bands:                    # upper bounds in INR; last band is open-ended
      - { label: "< ₹50K", max: 50000 }
      - { label: "₹50K–₹2L", max: 200000 }
      - { label: "₹2L–₹5L", max: 500000 }
      - { label: "> ₹5L" }
  - name: month
    label: FNOL month
    source: opened_month

activities:
  - { name: FNOL, label: First Notice of Loss }
  - { name: Document Check }
  - { name: Request Additional Documents, kind: customer_wait }
  - { name: Survey & Loss Assessment, applies_to: { line_of_business: motor } }
  - { name: Medical Adjudication, applies_to: { line_of_business: health } }
  - { name: Verification }
  - { name: QA }
  - { name: Senior Approval }
  - { name: Settlement }
  - { name: Closed }

# What the investigation engine analyses.
analysis:
  dimensions: [line_of_business, channel, region, team, amount_band]   # scanned for segment effects
  controls: [amount_band, line_of_business, channel, team]             # confounders for every segment effect
  outcomes:                       # loops compared across segments, besides `breached`
    doc_requested:
      label: additional-documents rate
      mechanism: an additional-documents request
      activity: Request Additional Documents
      when: present
    rework:
      label: verification rework rate
      mechanism: verification rework
      activity: Verification
      when: repeated
  wait_targets:                   # hours
    Senior Approval: 24           # POL-002 §5
    Survey & Loss Assessment: 24  # SOP-103 §2.1: surveyor appointed within one working day
  late_handoff_hour: 15

ui:
  system_of_record: the claims administration system (mock)
  overview:
    spotlight:
      metric: avg_csat
      label: Customer satisfaction (CSAT)
      secondary: survey_response_rate
      note: "Out of 5 · {n} responses ({secondary} response rate). Respondents only; unhappy customers respond more often."
    tiles:
      - { metric: rework_rate, label: Verification rework, note: Claims sent back by QA at least once }
      - { metric: doc_request_rate, label: Additional documents requested, note: Customer asked for more documents at least once }
      - { metric: senior_approval_rate, label: Need senior approval, note: "Claims above ₹2,00,000" }
    breakdown_dimensions: { amount_band: Amount, channel: Channel, line_of_business: Line of business, team: Team, region: Region }
    breakdown_metrics: { sla_breach_rate: SLA breach rate, avg_cycle_days: Cycle time, rework_rate: Rework, doc_request_rate: Documents requested }
  investigate_examples:
    - Why are claims breaching the five-day SLA? Find the root causes and recommend corrective actions.
    - Why do health claims take longer than motor claims?
    - What is the SLA breach rate by channel?
    - Can senior approvals be delegated to team leads?
    - Why do motor claims slow down in the monsoon months?
  knowledge_examples:
    - What should happen when the surveyor network falls behind in the monsoon?
    - Who approves a claim of ₹3,00,000, and how fast?
    - Can senior approvals be delegated? Under what conditions?
    - What happens to work handed over late on a Friday?
    - What QA rejection rate is acceptable for a verification team?
    - Why do broker claims arrive without complete documents?

approval:
  senior_threshold_inr: 200000          # claims above this need senior adjuster sign-off
  senior_target_hours: 24
  delegation:
    # Permitted by policy but NOT currently enabled: the recommendation the copilot should find.
    band_min_inr: 200000
    band_max_inr: 500000
    delegate_role: Team Lead
    status: permitted_not_enabled
    requires: Head of Claims sign-off

feedback:
  survey_delay_days: [1, 3]
  csat_scale: [1, 5]
  nps_scale: [0, 10]
