# Investigation benchmark: questions, what a correct investigation finds, and which decoys
# it must not accept. Scored against the generator's planted ground truth
# (backend/src/watchdog_backend/investigation/scoring.py).

questions:
  - id: sla_root_causes
    question: Why are claims breaching the five-day SLA? Find the root causes and recommend corrective actions.
    scope: {}
    expect_found: [RC1, RC2, RC3, RC4, RC5]
    decoys: [DC1, DC2, DC4]

  - id: health_vs_motor
    # Decoy bait: the honest answer is "it is claim value (senior approval), not health".
    # Since the ₹2L threshold (April 2026); before it, and with monsoon motor delays, health
    # and motor take about as long over the full 18 months.
    question: Why do health claims take longer than motor claims?
    scope: { period_from: "2026-04-01" }
    expect_found: [RC1]
    decoys: [DC1]

  - id: broker_channel
    question: Why are broker claims breaching the SLA, and what should we do?
    scope: { filters: { channel: [broker] } }
    expect_found: [RC2]
    decoys: []

  - id: monsoon_motor
    question: Why do motor claims slow down in the monsoon months?
    scope: { filters: { line_of_business: [motor] } }
    expect_found: [RC5]
    decoys: []

  - id: kolkata_region
    # Decoy bait: Kolkata is not the cause; most of its claims go to Team B.
    question: Why do Kolkata claims need so much rework, and what should we do?
    scope: {}
    expect_found: [RC3]
    decoys: [DC4]

# What counts as evidence for each planted cause (RC…) or decoy (DC…). A cause is found when a
# supported hypothesis carries evidence matching one of its targets; a decoy is accepted when a
# supported hypothesis's only targets are the decoy's.
ground_truth:
  RC1:
    label: Senior approval queue
    targets:
      - { check: activity_wait, activity: Senior Approval }
      - { check: segment, dimension: amount_band, values: ["₹2L–₹5L", "> ₹5L"] }
  RC2:
    label: Broker documents
    targets: [{ check: segment, dimension: channel, values: [broker] }]
  RC3:
    label: Team B rework
    targets: [{ check: segment, dimension: team, values: [Team B] }]
  RC4:
    label: Friday backlog
    targets: [{ check: weekday_handoff, weekday: Fri }]
  RC5:
    label: Monsoon surveyor backlog
    targets: [{ check: activity_wait, activity: Survey & Loss Assessment }]
  DC1:
    label: Health looks slower (it is claim value)
    targets: [{ check: segment, dimension: line_of_business, values: [health], outcome: breached }]
  DC2:
    label: Pune looks worse (small, broker-heavy)
    targets: [{ check: segment, dimension: region, values: [Pune] }]
  DC4:
    label: Kolkata looks worse (it is Team B)
    targets: [{ check: segment, dimension: region, values: [Kolkata] }]

# What-if check: each catalogue action's estimate is compared with an exact counterfactual from
# the generator's ground-truth summary (path of keys into ground_truth.json).
whatif_truth:
  delegate_mid_value_approvals: [delegation_scenario, breaches_avoided]
  add_senior_adjuster_capacity: [root_causes, RC1, breaches_attributable]
  enforce_broker_checklist: [root_causes, RC2, breaches_attributable]
  retrain_team_b: [root_causes, RC3, breaches_attributable]
  saturday_rota: [root_causes, RC4, breaches_attributable]
  activate_monsoon_survey_panel: [root_causes, RC5, breaches_attributable]

# For each planted cause, the catalogue actions that address it.
remedies:
  RC1: [delegate_mid_value_approvals, add_senior_adjuster_capacity]
  RC2: [enforce_broker_checklist]
  RC3: [retrain_team_b]
  RC4: [saturday_rota]
  RC5: [activate_monsoon_survey_panel]

# Answerable questions come from retrieval.yaml; these must be declined.
unanswerable:
  - What is the company's policy on cyber insurance claims?
  - What is the maximum sum insured for travel insurance?
  - How are life insurance death claims processed?
  - Who is the current CEO of the company?
  - What was the company's net profit last year?
