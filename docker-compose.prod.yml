# Public deployment (one server). Usage: see docs/DEPLOYMENT.md, or `make prod-up`.
#
# Differs from docker-compose.yml (development): code is baked into the images (no source
# mounts, no reload); the frontend is built once and served by Caddy, which also terminates
# HTTPS (certificates from Let's Encrypt, renewed automatically); only Caddy publishes ports
# to the internet; no Ollama (the server has no GPU: models come from Groq). The MCP servers
# publish on the server's loopback only, for MCP clients over an SSH tunnel; the read-only
# Analytics and Knowledge servers start only with COMPOSE_PROFILES=mcp in .env.
name: watchdog

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-watchdog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchdog}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  COOKIE_SECURE: "true"
  CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
  FORWARDED_ALLOW_IPS: "*"   # only Caddy can reach the backend; trust its X-Forwarded-*
  LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL:?set LLM_DEFAULT_MODEL in .env, a groq model}"
  LLM_MODELS: ${LLM_MODELS:-{}}
  LLM_LIGHT_MODEL: ${LLM_LIGHT_MODEL:-}
  # Groq's free tier allows 8,000 tokens per minute per model: parallel calls exhaust it and
  # fail with 429. One call at a time, and enough retries to wait out the minute (Retry-After).
  LLM_PARALLEL_CALLS: ${LLM_PARALLEL_CALLS:-1}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-8}
  RATE_LIMIT_INVESTIGATIONS_PER_USER_HOUR: ${RATE_LIMIT_INVESTIGATIONS_PER_USER_HOUR:-4}
  RATE_LIMIT_INVESTIGATIONS_PER_DAY: ${RATE_LIMIT_INVESTIGATIONS_PER_DAY:-12}
  RATE_LIMIT_QUESTIONS_PER_USER_HOUR: ${RATE_LIMIT_QUESTIONS_PER_USER_HOUR:-20}
  RATE_LIMIT_QUESTIONS_PER_DAY: ${RATE_LIMIT_QUESTIONS_PER_DAY:-80}
  WATCH_AUTO_INVESTIGATE: ${WATCH_AUTO_INVESTIGATE:-critical}
  ANONYMOUS_VISITORS: ${ANONYMOUS_VISITORS:-true}
  GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@watchdog.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_GITHUB_LOGIN: ${ADMIN_GITHUB_LOGIN:-}
  PUBLIC_URL: https://${DOMAIN}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  OPERATIONS_MCP_URL: http://operations-mcp:8103/mcp
  OPERATIONS_MCP_BACKEND_TOKEN: ${OPERATIONS_MCP_BACKEND_TOKEN:?run make secrets}
  # External MCP clients (over an SSH tunnel): an empty token is never accepted.
  OPERATIONS_MCP_TOKENS: '{"${OPERATIONS_MCP_BACKEND_TOKEN}": "watchdog-backend", "${OPERATIONS_MCP_EXTERNAL_TOKEN:-}": "external-agent"}'
  ANALYTICS_MCP_TOKENS: '{"${ANALYTICS_MCP_EXTERNAL_TOKEN:-}": "external-agent"}'
  KNOWLEDGE_MCP_TOKENS: '{"${KNOWLEDGE_MCP_EXTERNAL_TOKEN:-}": "external-agent"}'
  ENTERPRISE_API_URL: http://enterprise-mock:8201
  ENTERPRISE_API_KEY: ${ENTERPRISE_API_KEY:?run make secrets}

# Read-only repository content the app reads at run time (resolved from /app as ../<dir>).
x-repo-mounts: &repo-mounts
  - ./domain_packs:/domain_packs:ro
  - ./datasets:/datasets            # generated data (make prod-seed writes it)
  - ./.cache:/.cache                # embedding/reranker model files (downloaded once)
  - ./evaluation:/evaluation:ro     # saved evaluation runs (Models page)
  - ./showcase:/showcase:ro         # showcase runs to import (recorded locally: D59)

x-backend: &backend
  build: ./backend
  image: watchdog-backend:prod
  environment: *backend-env
  volumes: *repo-mounts
  logging: *logging
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watchdog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  migrate:
    build: ./backend
    image: watchdog-backend:prod
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["uvicorn", "watchdog_backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      # Generous for small servers: on a 1 GB, 1/8-core VM, starting Python for the check alone
      # takes over 3 s while the stack starts. Failures in the first 3 minutes do not count.
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s
      start_interval: 10s

  # Governed actions, for the backend and for MCP clients over an SSH tunnel (published on
  # the server's loopback only: never reachable from the internet).
  operations-mcp:
    <<: *backend
    command: ["uvicorn", "watchdog_backend.mcp_servers.operations:app", "--host", "0.0.0.0", "--port", "8103"]
    ports:
      - "127.0.0.1:8103:8103"

  # Read-only MCP servers for external clients (loopback only, SSH tunnel). Opt-in: each is
  # another Python process (Knowledge also loads the embedding model), too much for a 1 GB
  # server by default. Enable with COMPOSE_PROFILES=mcp in .env.
  analytics-mcp:
    <<: *backend
    profiles: ["mcp"]
    command: ["uvicorn", "watchdog_backend.mcp_servers.analytics:app", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "127.0.0.1:8101:8101"

  knowledge-mcp:
    <<: *backend
    profiles: ["mcp"]
    command: ["uvicorn", "watchdog_backend.mcp_servers.knowledge:app", "--host", "0.0.0.0", "--port", "8102"]
    ports:
      - "127.0.0.1:8102:8102"

  watcher:
    <<: *backend
    command: ["python", "-m", "watchdog_backend.watch", "--every", "${WATCH_INTERVAL_SECONDS:-3600}"]

  enterprise-mock:
    <<: *backend
    command: ["uvicorn", "watchdog_backend.enterprise_mock.app:app", "--host", "0.0.0.0", "--port", "8201"]

  # The only public service: HTTPS, the built frontend, and /api proxied to the backend.
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: watchdog-web:prod
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (certificate expiry notices)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates: keep, or Let's Encrypt rate limits bite
      - caddy_config:/config
    logging: *logging
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
